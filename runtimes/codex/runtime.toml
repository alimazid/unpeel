schema_version = 1
id = "com.openai.codex"
slug = "codex"
legacy_slug = "codex"
label = "Codex"
adapter = "builtin:codex"
legacy_order = 1
platforms = ["macos", "linux"]
supports_quick_launch = true
capabilities = ["lifecycle_hooks", "resume", "restart_agent", "mcp_sessions", "mcp_browser", "mcp_computer", "transcript", "notify_when_done"]

[display]
tint = "#C292FE"
spinner_tint = "#C292FE"
icon = "codex"
icon_asset = "assets/icon.svg"
icon_source = "internal:legacy-unpeel-tool-icons"
icon_license = "vendor-brand-asset"
window_padding_x = 8

[install]
official_url = "https://openai.com/codex"
command = "npm install -g @openai/codex"

[updates]
version_args = ["--version"]
latest_url = "https://registry.npmjs.org/@openai/codex/latest"
json_pointer = "/version"

[detection]
command_aliases = ["codex"]
process_aliases = ["codex"]
script_path_signatures = [{ components = ["@openai", "codex"] }]

[environment]
strip_inherited = ["CODEX_CI", "CODEX_INTERNAL_ORIGINATOR_OVERRIDE", "CODEX_SHELL", "CODEX_THREAD_ID", "CODEX_TUI_RECORD_SESSION", "CODEX_TUI_SESSION_LOG_PATH"]

[lifecycle]
source = "hooks"
authority = "complete"
fallback = "screen"
completion_reliable = true
attention_reliable = true

# Screen fallback (no integration installed): "• Working (12s • Esc to
# interrupt)" while a turn runs; the "› Ask Codex to do anything" prompt
# when idle.
[screen]
working = ["esc to interrupt", "• Working"]
idle_prompt = ["›"]

# The arguments that turn off this runtime's approval prompts.
[approvals]
bypass_flags = ["--dangerously-bypass-approvals-and-sandbox", "--yolo"]

# Fork-only (#68): context windows by model id prefix (the longest match
# wins), the usable windows Codex reports in its rollout's token_count
# events: models-manager/models.json `context_window` at its default
# effective_context_window_percent of 95, from rust-v0.167.0 on 2026-11-09.
# Codex's footer ("NN% context left") leaves a 12,000-token baseline out of
# both the count and the window, and so does the Host. A model none of them
# names is never compacted, and neither is a window a user raised with
# `model_context_window` in config.toml. `/compact` runs only while Codex is
# idle; it reports 7501 working, then done (no Stop hook or notify fires).
[context]
compact_command = "/compact"
baseline_tokens = 12000
windows = [
  { model_prefix = "gpt-6-astra", tokens = 258400 },
  { model_prefix = "gpt-6-sol", tokens = 258400 },
  { model_prefix = "gpt-6-luna", tokens = 258400 },
  { model_prefix = "gpt-6.1-sol", tokens = 258400 },
  { model_prefix = "gpt-6.1-terra", tokens = 475000 },
  { model_prefix = "gpt-5.6-sol", tokens = 258400 },
  { model_prefix = "gpt-5.6-terra", tokens = 258400 },
  { model_prefix = "gpt-5.6-luna", tokens = 258400 },
  { model_prefix = "gpt-5.5", tokens = 258400 },
  { model_prefix = "gpt-daybreak-blue-latest", tokens = 258400 },
  { model_prefix = "gpt-daybreak-red-latest", tokens = 353400 },
  { model_prefix = "codex-auto-review", tokens = 258400 },
]

[integration]
summary = "Registers native hooks in ~/.codex/hooks.json, the notify reporter and [mcp_servers.unpeel] in ~/.codex/config.toml."
legacy_evidence = ["hooks/codex-notify-hook.sh"]

[[usage.stores]]
root = ".codex/sessions"
extensions = ["jsonl"]

# `--no-daemon` (Codex 0.156+) keeps Codex's app-server inside the Session.
# Without it, Codex attaches to its shared background daemon (and from 0.157
# starts one), which starts MCP servers and runs hooks outside the Session,
# so the Unpeel tools and hooks can't tell which Session they belong to
# (docs/agents/providers.md).
[[suggested_presets]]
id = "codex"
label = "codex --no-daemon --dangerously-bypass-approvals-and-sandbox"
command = "codex --no-daemon --dangerously-bypass-approvals-and-sandbox"
quick_launch = true
